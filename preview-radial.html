<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vem — preview do menu radial</title>
<style>
  :root {
    --paper: #FCF8FC;
    --ink: #302437;
    --ink-muted: #8a7f92;
    --surface: #ffffff;
    --line: #E7DAE7;
    --vermilion: #F57335;
    --plum: #F77CC5;
    --sky: #CFE8F3;
    --amber: #FFD444;
    --sage: #CFE3C4;
    --tint-sky: #E7F2F7;
    --shadow-2: 0 6px 20px rgba(48, 36, 55, 0.18);
    --r-md: 16px;
    --r-lg: 24px;
    --r-pill: 999px;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    background: #efe6ef;
    font-family: "Nunito Sans", system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }
  .stage { width: min(360px, 100%); }

  /* — Card (idêntico ao app) — */
  .match-card {
    position: relative;
    border-radius: var(--r-lg);
    overflow: hidden;
    background: var(--ink);
    box-shadow: var(--shadow-2);
    -webkit-user-select: none;
    user-select: none;
  }
  .match-card__photo {
    position: relative;
    height: 300px;
    background: linear-gradient(160deg, #dae35a, #c799c8 55%, #302437);
    overflow: hidden;
  }
  .match-card__photo .ph {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
    mix-blend-mode: multiply;
    opacity: 0.92;
  }
  .match-card__compat {
    position: absolute;
    top: 14px;
    right: 14px;
    padding: 5px 10px;
    border-radius: var(--r-pill);
    background: rgba(255, 255, 255, 0.85);
    font-size: 12px;
    font-weight: 800;
    color: var(--ink);
  }
  .match-card__body { padding: 18px 20px 20px; color: var(--paper); }
  .match-card__name { margin: 0; font-size: 20px; }
  .match-card__meta { margin: 4px 0 0; font-size: 13px; opacity: 0.8; }
  .match-card__bio { margin: 10px 0 0; font-size: 13px; opacity: 0.9; }
  .match-card__tags { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .tag {
    padding: 3px 10px;
    border-radius: var(--r-pill);
    background: rgba(252, 248, 252, 0.12);
    font-size: 12px;
    font-weight: 700;
  }

  /* — Menu radial — */
  .match-radial {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: rgba(48, 36, 55, 0.62);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms var(--ease);
  }
  .match-card.is-radial-open .match-radial { opacity: 1; pointer-events: auto; }

  .match-radial__action {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 0;
    cursor: pointer;
    box-shadow: var(--shadow-2);
    -webkit-tap-highlight-color: transparent;
    transition: transform 260ms cubic-bezier(0.2, 0.9, 0.25, 1.25),
      background 160ms var(--ease), box-shadow 160ms var(--ease);
  }
  .match-radial__skip, .match-radial__connect {
    top: 50%;
    transform: translateY(-50%) scale(0);
  }
  .match-card.is-radial-open .match-radial__skip,
  .match-card.is-radial-open .match-radial__connect {
    transform: translateY(-50%) scale(1);
  }
  .match-radial__skip {
    left: 20px; width: 54px; height: 54px; border-radius: 50%;
    background: var(--paper); color: var(--ink);
    font-size: 24px; font-weight: 800;
  }
  .match-radial__connect {
    right: 20px; width: 58px; height: 58px; border-radius: 50%;
    background: var(--vermilion); color: var(--ink);
  }
  .match-radial__emoji { font-size: 26px; line-height: 1; }

  .match-radial__chips { position: absolute; inset: 0; pointer-events: none; }
  .match-radial__chip {
    position: absolute;
    left: 50%; top: 50%;
    height: 38px; padding: 0 14px;
    border-radius: var(--r-pill);
    background: var(--paper); color: var(--ink);
    font-family: inherit; font-size: 13px; font-weight: 700;
    white-space: nowrap; pointer-events: auto;
    transform: translate(-50%, -50%) translate(var(--tx, 0px), var(--ty, 0px)) scale(0);
    transition: transform 260ms cubic-bezier(0.2, 0.9, 0.25, 1.25);
  }
  .match-card.is-radial-open .match-radial__chip {
    transform: translate(-50%, -50%) translate(var(--tx, 0px), var(--ty, 0px)) scale(1);
  }
  .match-radial__chip .match-radial__emoji { font-size: 17px; }

  .hint {
    margin-top: 16px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-muted);
  }
</style>
</head>
<body>
  <div class="stage">
    <article class="match-card is-radial-open">
      <div class="match-card__photo">
        <img class="ph" src="assets/img/marina.jpg" alt="">
        <span class="match-card__compat">87% combinam</span>
      </div>
      <div class="match-card__body">
        <h2 class="match-card__name">Marina, 28</h2>
        <p class="match-card__meta">📍 2,4 km · Vila Madalena</p>
        <p class="match-card__bio">Corro de manhã e cozinho à noite.</p>
        <div class="match-card__tags">
          <span class="tag">🏃 Corrida</span><span class="tag">🧘 Yoga</span><span class="tag">5 km</span>
        </div>
      </div>

      <div class="match-radial">
        <button class="match-radial__action match-radial__skip" type="button">✕</button>
        <button class="match-radial__action match-radial__connect" type="button">
          <span class="match-radial__emoji">👍</span>
        </button>
        <div class="match-radial__chips">
          <button class="match-radial__action match-radial__chip" type="button" style="--tx:-90px;--ty:-130px;transition-delay:60ms">
            <span class="match-radial__emoji">🏃</span> Corrida
          </button>
          <button class="match-radial__action match-radial__chip" type="button" style="--tx:0px;--ty:-172px;transition-delay:105ms">
            <span class="match-radial__emoji">🧘</span> Yoga
          </button>
          <button class="match-radial__action match-radial__chip" type="button" style="--tx:90px;--ty:-130px;transition-delay:150ms">
            <span class="match-radial__emoji">🏋️</span> Musculação
          </button>
        </div>
      </div>
    </article>
    <p class="hint">Toque no card para ver o perfil · segure para abrir as ações</p>
  </div>
</body>
</html>
